<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Insights — Capstone Invest Group</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&family=Barlow+Condensed:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--navy:#0A0E1A;--gold:#C9A84C;--white:#F5F3EE;--white-dim:rgba(245,243,238,0.55);--line:rgba(201,168,76,0.25)}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--navy);color:var(--white);font-family:'Barlow Condensed',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
    .eyebrow{font-size:.6rem;letter-spacing:.38em;text-transform:uppercase;color:var(--gold);margin-bottom:24px;display:flex;align-items:center;justify-content:center;gap:14px}
    .eyebrow::before,.eyebrow::after{content:'';width:28px;height:1px;background:var(--gold)}
    h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.5rem,6vw,5rem);line-height:.95;color:var(--white);margin-bottom:24px}
    h1 em{font-style:italic;color:var(--gold)}
    p{font-size:.82rem;color:var(--white-dim);line-height:1.9;max-width:420px;margin-bottom:40px}
    a{font-family:'Barlow Condensed',sans-serif;font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--navy);background:var(--gold);padding:14px 32px;text-decoration:none;transition:background .3s}
    a:hover{background:#E2C47A}
  </style>
</head>
<body>
  <div class="eyebrow">Insights</div>
  <h1>Coming<br><em>Soon</em></h1>
  <p>Our market intelligence and research hub is currently in development. In the meantime, speak with an advisor directly.</p>
  <a href="contact.html">Speak with an Advisor</a>
</body>
</html>
